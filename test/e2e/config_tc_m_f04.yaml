global:
  name: "TC-M-F04"
  checkpoint_dir: "./test/e2e/checkpoints/tc-m-f04"
  report_dir: "./test/e2e/reports/tc-m-f04"

logging:
  level: "info"
  output: "both"
  file:
    path: "test/e2e/logs/tc-m-f04.log"
    max_size: 10
    max_backups: 3
    max_age: 7
    compress: true

influx_to_influx:
  enabled: true
  query_mode: "batch"

sources:
  - name: "influxdb-v1"
    type: influxdb
    database: "test_source"
    influxdb:
      version: "1"
      url: "http://127.0.0.1:8084"

targets:
  - name: "influxdb-v1"
    type: influxdb-v1
    database: "test_target"
    influxdb:
      version: "1"
      url: "http://127.0.0.1:8086"

tasks:
  - name: "time-filtered-migration"
    source: "influxdb-v1"
    target: "influxdb-v1"
    mappings:
      - source_table: "cpu"
        target_measurement: "cpu"
        time_range:
          start: "2025-04-22T00:00:00Z"
          end: "2025-04-23T00:00:00Z"
