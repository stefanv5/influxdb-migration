global:
  name: "TC-S-F02"
  checkpoint_dir: "./test/e2e/checkpoints/tc-s-f02"
  report_dir: "./test/e2e/reports/tc-s-f02"

logging:
  level: "debug"
  output: "both"
  file:
    path: "test/e2e/logs/tc-s-f02.log"
    max_size: 10
    max_backups: 3
    max_age: 7
    compress: true

influx_to_influx:
  enabled: true
  query_mode: "single"

sources:
  - name: "influxdb-v1"
    type: influxdb
    database: "test_source"
    influxdb:
      version: "1"
      url: "http://127.0.0.1:8084"

targets:
  - name: "influxdb-v1"
    type: influxdb-v1
    database: "test_target"
    influxdb:
      version: "1"
      url: "http://127.0.0.1:8086"

tasks:
  - name: "multi-measurement-migration"
    source: "influxdb-v1"
    target: "influxdb-v1"
    mappings:
      - source_table: "cpu"
        target_measurement: "cpu"
      - source_table: "memory"
        target_measurement: "memory"
      - source_table: "disk"
        target_measurement: "disk"
